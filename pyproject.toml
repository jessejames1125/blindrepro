[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blindrepro"
version = "0.1.0"
description = "An agent re-derives a published result from the paper alone, then code compares it with the authors' own code."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jessejames1125" }]
keywords = ["reproducibility", "research", "science", "llm", "claude", "replication"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.scripts]
blindrepro = "blindrepro.cli:main"

[project.optional-dependencies]
api = ["anthropic>=2,<3"]
dev = ["pytest>=8", "pytest-cov>=5", "anthropic>=2,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/blindrepro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["blindrepro"]
omit = ["*/data/*"]
